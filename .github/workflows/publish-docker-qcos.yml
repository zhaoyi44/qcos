# This workflow will build, publish and test the following images: sandbox/qcos/qcos-cli docker
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build/Publish/Test QCOS docker image

on:
  push:
    branches: [ develop, test ]
    tags:
      - "v*"
  schedule:
    # trigger on every night (14:00 UTC / 22:00 CST)
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-st-qcos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run System Tests (QCOS)
        shell: bash
        run: |
          sudo -s <<'EOF'
          TOP_DIR=$(pwd)
          ln -s /usr/libexec/docker/cli-plugins/docker-compose /usr/bin/docker-compose

          # config
          cd ${TOP_DIR}/build-scripts
          cp ./env.template ./.env
          sed -i 's/^QCOS_VERSION=.*/QCOS_VERSION=nightly/' ./version
          sed -i 's/^LOCAL_CICD=.*/LOCAL_CICD=True/' ./.env
          sed -i 's/^QCOS_REGISTRY=.*/QCOS_REGISTRY=qcos\//' ./.env
          mkdir -p /etc/qcos/
          cp -rf ${TOP_DIR}/etc/qcos/st-conf.d /etc/qcos/
          cp -rf ${TOP_DIR}/etc/qcos/qcos-st.toml /etc/qcos/qcos.toml

          # run docker
          ./run-docker.sh

          # waiting for qcos docker running
          QCOS_SERVER_IP=127.0.0.1
          QCOS_SERVER_PORT=18400
          MAX_ATTEMPTS=30
          SLEEP_INTERVAL=10
          count=0
          echo "qcos-api: http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT}"
          until curl -o /dev/null -s http://${QCOS_SERVER_IP}:${QCOS_SERVER_PORT} || [ $count -ge ${MAX_ATTEMPTS} ]; do
            echo "waiting for qcos-api ... (attempt $((count+1))/${MAX_ATTEMPTS})"
            sleep ${SLEEP_INTERVAL}
            count=$((count+1))
          done
          if [ ${count} -lt ${MAX_ATTEMPTS} ]; then
            echo "qcos-api is ready"
          else
            total_seconds=$((MAX_ATTEMPTS * SLEEP_INTERVAL))
            echo "ERROR: qcos-api did not become ready after ${MAX_ATTEMPTS} attempts (total ${MAX_ATTEMPTS}*${SLEEP_INTERVAL}=${total_seconds} seconds)"
            exit 1
          fi

          # run system tests in qcos
          sleep 10
          echo "Running system tests in container: qcos"
          cd ${TOP_DIR}
          tar czf /tmp/cicd.tar.gz ./cicd ./src ./samples
          docker cp /tmp/cicd.tar.gz qcos:/tmp/
          docker exec qcos sh -c "mkdir -p /root/qcos-project/; cd /root/qcos-project/; tar xzf /tmp/cicd.tar.gz"
          docker exec qcos sh -c "source /root/.bashrc; echo 'Driver list:'; qcos-cli list-devices; echo 'Job list:'; qcos-cli list-jobs; cd /root/qcos-project; ./cicd/run-tests.sh -s all"
          EOF

